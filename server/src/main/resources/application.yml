spring:
  application:
    name: clyde-exchange
  task:
    scheduling:
      pool:
        size: 3   # one thread for the bots, one for publishing market data, one for saving to the database
  datasource:
    # Where the exchange's state is saved. The default is an H2 database: a single file in ./data, no setup.
    # To use PostgreSQL instead, set the environment variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME
    # and SPRING_DATASOURCE_PASSWORD (docker-compose.yml does this). Delete ./data to start the market afresh.
    url: jdbc:h2:file:./data/clyde

server:
  port: 8080
  # Behind a reverse proxy that adds HTTPS (such as Caddy), believe its X-Forwarded-Proto header, so the server
  # knows the browser is on https and marks the login cookie Secure. Only proxies on a private network are believed.
  forward-headers-strategy: native

exchange:
  # Prices everywhere are in ticks of 1p, so 10050 = £100.50
  instruments:   # what can be traded. start-price is where each one opens.
    - { symbol: MANN, name: Mannan Technologies, sector: Technology, start-price: 10000 }
    - { symbol: CLYD, name: Clyde Digital,       sector: Technology, start-price: 5000 }
    - { symbol: KELV, name: Kelvin Systems,      sector: Technology, start-price: 18200 }
    - { symbol: NSEA, name: North Sea Energy,    sector: Energy,     start-price: 3450 }
    - { symbol: TIDE, name: Tidal Power,         sector: Energy,     start-price: 1280 }
    - { symbol: GLAS, name: Glasgow Bank,        sector: Finance,    start-price: 6400 }
    - { symbol: FORT, name: Forth Insurance,     sector: Finance,    start-price: 2750 }
    - { symbol: LOMD, name: Lomond Foods,        sector: Consumer,   start-price: 840 }
    - { symbol: ARRN, name: Arran Retail,        sector: Consumer,   start-price: 2100 }
    - { symbol: CALE, name: Caledonia Pharma,    sector: Health,     start-price: 14500 }
  circuit-breaker:   # pause trading in a symbol whose price moves this far, this fast
    threshold-percent: 5
    window-seconds: 60
    halt-seconds: 15
  auth:
    signup-cash: 10000000    # what everyone who registers starts with, in ticks: 10000000 = £100,000
    signup-enabled: true     # false: nobody new can register, existing users can still log in
    max-users: 1000          # registration closes by itself at this many users
  api:
    orders-per-second: 20    # the most orders and cancels one account may send in a second
  sim:
    enabled: true
